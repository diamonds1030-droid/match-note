<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 変更後（ユーザーの拡大倍率を1.0に固定） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>少年サッカー試合ノート</title>

    <!-- ============================================== -->
    <!-- iPhone (iOS Safari) 用アイコン設定 -->
    <!-- ============================================== -->
    <link rel="apple-touch-icon" sizes="180x180" href="03F5361F-6AAA-49CE-B0A9-42AEC001ACA3.png">
    <!-- Safariでアプリっぽく見せる（アドレスバー等を隠す設定） -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="アプリ名">

    <!-- ============================================== -->
    <!-- Android (Chrome) / PWA 用設定 -->
    <!-- ============================================== -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32"> <!-- ブラウザのテーマカラー（緑など） -->
</head>

<head>



<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div id="app">
    
<!-- ===================================== -->
<!-- 共通ヘッダー -->
<!-- ===================================== -->
<header id="commonHeader" class="subHeader" style="display:none">

    <button id="headerHomeButton" class="homeButton">
        <i class="fa-solid fa-house"></i>
    </button>

    <h2 id="headerTitle"></h2>

    <div id="headerRight" class="headerRight"></div>

</header>

<!-- ===================================== -->
<!-- ホーム -->
<!-- ===================================== -->

<section id="homePage" class="page active">

<header class="subHeader">
    <h2>⚽ 少年サッカー試合ノート</h2>
</header>

<main>
    <button id="teamButton">👥 チーム管理</button>
    <button id="playerButton">👤 選手登録</button>
    <button id="createTournamentButton">🏆 新しい大会</button>
    <button id="matchButton">📝 試合ノート</button>
    <button id="historyButton">📖 試合ノート履歴</button>
</main>

</section>

<!-- ===================================== -->
<!-- チーム管理 -->
<!-- ===================================== -->
<section id="teamPage" class="page">
<main>

    <!-- チーム管理のタイトル行 
    <div class="playerHeader">
        <span class="playerHeaderName" style="padding-left: 10px;">登録済みチーム一覧</span>
    </div>
-->
    <div id="teamList"></div>
</main>
</section>

<!-- ===================================== -->
<!-- 選手登録 -->
<!-- ===================================== -->

<section id="playerPage" class="page">
<main>

<h3>チーム選択</h3>
<select id="teamSelect" style="width: 100%; height: 40px; margin-bottom: 15px; font-size: 16px;">
</select>
<!-- <div id="teamManageList"></div> -->
    <!-- チーム管理のタイトル行 
    <div class="playerHeader">
        <span class="playerHeaderName" style="padding-left: 10px;">登録済みチーム一覧</span>
    </div>
修正箇所：余分な<h3>、<div class="playerHeader">、保存ボタンを削除 -->
<div id="playerList"></div>

</main>

</section>

<!-- ===================================== -->
<!-- 試合ノート -->
<!-- ===================================== -->
<section id="matchPage" class="page">
    <main class="matchMain">

        <!-- 1. 大会情報 -->
        <div class="card">
            <div class="inputRow">
                <label for="matchDate">日付</label>
                <input type="date" id="matchDate">
    
                <label for="matchName">大会名</label>
                <input type="text" id="matchName" placeholder="例: 第10回 市民サッカー大会">

                <label for="matchPlace">会場</label>
                <input type="text" id="matchPlace" placeholder="例: ○○グラウンド A">
            </div>
        </div>

        
        <div class="matchTabs">
            <div class="matchTabHeader">
                <div id="matchTabArea"></div>
                <button id="addMatchButton" class="iconButton">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </div>

        <div class="card">
            <h3>試合結果</h3>

            <div class="scoreTeamRow">
                <select id="homeTeamSelect" class="scoreTeamSelect"></select>
                <span class="scoreVs">VS</span>
                <input id="awayTeam" class="scoreTeamInput" placeholder="アウェイチーム">
            </div>

            <div class="scoreBoard">
                <span id="homeScore" class="score">0</span>
                <span class="scoreSeparator">－</span>
                <span id="awayScore" class="score">0</span>
            </div>
            
            <div id="goalHistory"></div>
        </div>

        <div class="card">
            <h3>出場選手（スタメン）</h3>
            <div id="lineupArea"></div>
        </div>

        </main>

    <nav class="match-footer">
        <button type="button" class="footer-btn" onclick="openMatchDrawer('lineup')">
            <i class="fa-solid fa-users"></i>
            <span>スタメン</span>
        </button>
        <button type="button" class="footer-btn" onclick="openMatchDrawer('goals')">
            <i class="fa-solid fa-futbol"></i>
            <span>得点操作</span>
        </button>
        <button type="button" class="footer-btn" onclick="openMatchDrawer('subs')">
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
            <span>交代</span>
        </button>
    </nav>

    <div id="drawerOverlay" class="drawer-overlay" onclick="closeMatchDrawer()"></div>
    <div id="matchDrawer" class="match-drawer">
        <div class="drawer-header">
            <h3 id="drawerTitle">タイトル</h3>
            <button type="button" class="drawer-close-btn" onclick="closeMatchDrawer()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="drawer-body">
            <div id="drawerContent"></div>
        </div>
    </div>

    <div style="display: none;">
        <div id="substitutionArea"></div>
    </div>
</section>


<!-- ===================================== -->
<!-- 共通ダイアログ -->
<!-- ===================================== -->
<div id="commonDialog" class="dialog">

    <div class="dialogBody">

        <h3 id="dialogTitle"></h3>

        <div id="dialogContent"></div>

        <div id="dialogButtons"></div>

    </div>

</div>



<!-- ===================================== -->
<!-- 試合履歴 -->
<!-- ===================================== -->

<section id="historyPage" class="page">
    <main>
        <div id="historyList">
            試合データはありません
        </div>
    </main>
</section>


</div>

<!-- アプリ -->
<script type="module" src="script.js"></script>

</body>

</html>

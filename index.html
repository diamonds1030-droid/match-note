<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>少年サッカー試合ノート</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ホーム画面 -->
<div id="homePage" class="page active">

    <h1>⚽ 少年サッカー試合ノート</h1>

    <button onclick="showPage('playerPage')">
        選手登録
    </button>

    <button onclick="showPage('matchPage')">
        試合ノート
    </button>

    <button onclick="showPage('historyPage')">
        試合ノート履歴
    </button>

</div>

<!-- 選手登録 -->
<div id="playerPage" class="page">

    <h2>選手登録</h2>

    <!-- 選手一覧 -->
    <div id="playerList"></div>

    <!-- 保存ボタン -->
    <button id="savePlayersButton">
        保存
    </button>

    <!-- ホームへ戻る -->
    <button onclick="showPage('homePage')">
        ← ホームへ戻る
    </button>

</div>

<!-- 試合ノート -->
<div id="matchPage" class="page">

    <h2>試合ノート</h2>
    <div class="matchHeader">

        <label>日付</label>
        <input type="date" id="matchDate">

        <label>会場</label>
        <input type="text" id="matchPlace">

        <label>ホーム</label>
        <input type="text" id="homeTeam">

        <label>アウェイ</label>
        <input type="text" id="awayTeam">

    </div>

    <div class="scoreArea">

        <span id="homeScore">0</span>
        <span>－</span>
        <span id="awayScore">0</span>

    </div>
    <h3>スタメン</h3>
    <div id="lineupArea"></div>
    <h3>得点</h3>
    <div id="goalArea"></div>
    <h3>交代</h3>
    <div id="substitutionArea"></div>
    <button id="saveMatchButton">
        保存
    </button>
    <button onclick="showPage('homePage')">
        ← ホームへ戻る
    </button>

</div>

<!-- 試合履歴 -->
<div id="historyPage" class="page">

    <h2>試合ノート履歴</h2>

    <button onclick="showPage('homePage')">
        ← ホームへ戻る
    </button>

</div>

<script src="script.js"></script>

</body>
</html>

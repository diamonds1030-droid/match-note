<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>少年サッカー試合ノート</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="app">

<!-- ===================================== -->
<!-- ホーム -->
<!-- ===================================== -->

<section id="homePage" class="page active">

<header>

<h1>⚽ 少年サッカー試合ノート</h1>

</header>

<main>

<button id="playerButton">

👤 選手登録

</button>

<button id="matchButton">

📝 試合ノート

</button>

<button id="historyButton">

📖 試合ノート履歴

</button>

</main>

</section>

<!-- ===================================== -->
<!-- 選手登録 -->
<!-- ===================================== -->

<section id="playerPage" class="page">

<header class="subHeader">

<button class="backButton">

← 戻る

</button>

<h2>選手登録</h2>

<button id="savePlayersButton">

保存

</button>

</header>

<main>

<div id="playerList"></div>

</main>

</section>

<!-- ===================================== -->
<!-- 試合ノート -->
<!-- ===================================== -->

<!-- ===================================== -->
<!-- 試合ノート -->
<!-- ===================================== -->

<section id="matchPage" class="page">

    <header class="subHeader">
        <button class="backButton">← 戻る</button>

        <h2>試合ノート</h2>
        <button id="undoButton">操作取消</button>
        <button id="saveMatchButton">保存</button>
    </header>

    <main class="matchMain">

        <!-- 試合情報 -->
        <div class="card">

            <div class="inputRow">
                <label>日付</label>
                <input type="date" id="matchDate">
            
                <label>大会名</label>
                <input type="text" id="matchPlace" placeholder="大会名">
            </div>

        </div>
        
<div class="matchTabs">

    <div id="matchTabArea"></div>
    <button id="addMatchButton">
        ＋試合追加
    </button>

</div>
         <!-- チーム -->
          <div class="teamRow">

                <input
                    type="text"
                    id="homeTeam"
                    placeholder="ホームチーム">

                <span class="vs">VS</span>

                <input
                    type="text"
                    id="awayTeam"
                    placeholder="アウェイチーム">

            </div>
<!-- スコア -->
<div class="card">

    <h3>得点</h3>

    <!-- チーム名 -->
    <div class="scoreTeamRow">

        <span id="homeTeamName" class="scoreTeam">
            ホーム
        </span>

        <span class="scoreVs">VS</span>

        <span id="awayTeamName" class="scoreTeam">
            アウェイ
        </span>

    </div>

            <div class="scoreBoard">
                <span id="homeScore" class="score">0</span>
                <span class="scoreSeparator">－</span>
                <span id="awayScore" class="score">0</span>
            </div>
      <!-- 得点履歴 -->
            <div id="goalHistory">
            </div>

        </div>

        <!-- 出場選手 -->
        <div class="card">

            <h3>出場選手</h3>

            <div id="lineupArea"></div>

            <div class="specialGoalButtons">

                <button id="ownGoalButton" class="goalButton own">
                    オウンゴール
                </button>

                <button id="opponentGoalButton" class="goalButton opponent">
                    相手得点
                </button>

            </div>

        </div>

        <!-- 交代 -->
        <div class="card">
            <h3>交代</h3>
            <div id="substitutionArea"></div>
        </div>

    </main>

</section>

<!-- ===================================== -->
<!-- 試合履歴 -->
<!-- ===================================== -->

<section id="historyPage" class="page">

<header class="subHeader">

<button class="backButton">

← 戻る

</button>

<h2>

試合履歴

</h2>

</header>

<main>

<div id="historyList">

試合データはありません

</div>

</main>

</section>

</div>

<script src="script.js"></script>

</body>

</html>

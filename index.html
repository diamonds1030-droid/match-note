<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 変更後（ユーザーの拡大倍率を1.0に固定） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>試合ノート</title>

    <!-- ============================================== -->
    <!-- iPhone (iOS Safari) 用アイコン設定 -->
    <!-- ============================================== -->
    <link rel="apple-touch-icon" sizes="180x180" href="03F5361F-6AAA-49CE-B0A9-42AEC001ACA3.png">
    <!-- Safariでアプリっぽく見せる（アドレスバー等を隠す設定） -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="アプリ名">

    <!-- ============================================== -->
    <!-- Android (Chrome) / PWA 用設定 -->
    <!-- ============================================== -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32"> <!-- ブラウザのテーマカラー（緑など） -->

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div id="app">
    
<!-- ===================================== -->
<!-- 共通ヘッダー -->
<!-- ===================================== -->
<header id="commonHeader" class="subHeader" style="display:none">

    <button id="headerHomeButton" class="homeButton">
        <i class="fa-solid fa-house"></i>
    </button>

    <h2 id="headerTitle"></h2>

    <div id="headerRight" class="headerRight"></div>

</header>

<!-- ===================================== -->
<!-- ホーム -->
<!-- ===================================== -->

<section id="homePage" class="page active">

<header class="subHeader">
    <h2>⚽ 試合ノート</h2>
</header>

<main>
    <button id="teamButton">👥 チーム管理</button>
    <!--
    <button id="playerButton">👤 選手登録</button>
    <button id="createTournamentButton">🏆 新しい大会</button>
    <button id="matchButton">📝 試合ノート</button>
    -->
    <button id="historyButton">📖 試合ノート一覧</button>
            <!-- ★追加：通算得点ランキング表示エリア -->
        <div class="card rankingCard">
            <h3 class="rankingTitle">🏆 通算得点ランキング</h3>
            <div id="goalRanking">
                <!-- ここに JavaScript (renderGoalRanking) で自動挿入されます -->
            </div>
        </div>
</main>

</section>

<section id="homePage" class="page active">

    <header class="subHeader">
        <h2>⚽ 試合ノート</h2>
    </header>

    <main>
        <!-- ナビゲーションボタンエリア -->
        <div class="buttonGroup">
            <button id="teamButton">👥 チーム管理</button>
            <button id="matchButton">📝 試合ノート作成</button>
            <button id="historyButton">📖 試合ノート一覧</button>
            <!--
            <button id="playerButton">👤 選手登録</button>
            <button id="createTournamentButton">🏆 新しい大会</button>
            -->
        </div>

        <!-- ★追加：通算得点ランキング表示エリア -->
        <div class="card rankingCard">
            <h3 class="rankingTitle">🏆 通算得点ランキング</h3>
            <div id="goalRanking">
                <!-- ここに JavaScript (renderGoalRanking) で自動挿入されます -->
            </div>
        </div>
    </main>

</section>

 
<!-- ===================================== -->
<!-- チーム管理 -->
<!-- ===================================== -->
<section id="teamPage" class="page">
<main>
    <div id="teamList"></div>
</main>
</section>

<!-- ===================================== -->
<!-- 選手登録 -->
<!-- ===================================== -->

<section id="playerPage" class="page">
    <main>
        <h3>チーム選択</h3>
            <select id="teamSelect" style="width: 100%; height: 40px; margin-bottom: 15px; font-size: 16px;">
            </select>
        <div id="playerList"></div>
    </main>
</section>

<!-- ===================================== -->
<!-- 試合ノート -->
<!-- ===================================== -->
<section id="matchPage" class="page">
    <main class="matchMain">
    <div class="matchFixedArea">
    <!-- 1行目：日付と会場 -->
    <div class="row-top">
        <div class="form-group">
            <label>日付</label>
            <input type="date" id="matchDate">
        </div>
        <div class="form-group">
            <label>会場</label>
            <input type="text" id="matchPlace">
        </div>
    </div>

    <!-- 2行目：大会名 -->
    <div class="row-bottom">
        <div class="form-group">
            <label>大会名</label>
            <input type="text" id="matchName">
        </div>
    </div>
</div>

        <div class="matchTabs">
            <div class="matchTabHeader">
                <div id="matchTabArea"></div>
                <button id="addMatchButton" class="iconButton">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </div>

        <!-- 2. 試合結果 & 得点履歴 -->
        <div class="card" style="position: relative;">
            <div class="scoreHeaderRow">
                <h3>試合結果</h3>
        <!-- ヘッダーと全く同じ構成のボタンを追加 -->
                <button id="undoButton" class="iconButton">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>
            <div class="scoreTeamRow">
                <select id="homeTeamSelect" class="scoreTeamSelect"></select>
                <span class="scoreVs">VS</span>
                <input id="awayTeam" class="scoreTeamInput" placeholder="アウェイチーム">
            </div>
            <!-- スコア表示エリアの例 -->
            <div class="scoreBoard">
                <span id="homeScore" class="score">0</span>
                <span class="scoreSeparator">－</span>
                <span id="awayScore" class="score">0</span>
            </div>
            <!-- ★ ここにPK結果の表示枠を追加 -->
            <div id="pkScoreDisplay" class="pkScoreDisplay"></div>
            <!-- 得点履歴エリア -->
            <div id="goalHistory" class="goalHistory"></div>
        </div>

<!-- 3. 交代履歴 -->
<div class="card">
    <div style="display: flex">
        <h3>交代履歴</h3>
        <!-- ヘッダーや得点欄と全く同じ iconButton を追加 -->
        <button id="undoSubButton" class="iconButton">
            <i class="fa-solid fa-rotate-left"></i>
        </button>
    </div>
    <div id="subHistory" class="subHistory"></div>
</div>


    </main>

    <!-- フッターナビゲーション -->
    <nav class="match-footer">
        <button type="button" class="footer-btn" onclick="openMatchDrawer('lineup')">
            <i class="fa-solid fa-users"></i>
            <span>スタメン</span>
        </button>
        <button type="button" class="footer-btn" onclick="openMatchDrawer('goals')">
            <i class="fa-solid fa-futbol"></i>
            <span>得点操作</span>
        </button>
        <button type="button" class="footer-btn" onclick="openMatchDrawer('subs')">
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
            <span>交代</span>
        </button>
        <button id="pkBtn" class="footer-btn">
            <i class="fa-solid fa-futbol"></i>
            <span>PK戦</span>
        </button>
    </nav>

    <!-- ドロワー（ポップアップ） -->
    <div id="drawerOverlay" class="drawer-overlay" onclick="closeMatchDrawer()"></div>
    <div id="matchDrawer" class="match-drawer">
        <div class="drawer-header">
            <h3 id="drawerTitle">タイトル</h3>
            <button type="button" class="drawer-close-btn" onclick="closeMatchDrawer()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="drawer-body">
            <div id="drawerContent"></div>
        </div>
    </div>
</section>

<!-- PK戦ドロワー -->
<div id="pkDrawerOverlay" class="drawer-overlay" onclick="closePKDrawer()"></div>
<div id="pkDrawer" class="match-drawer">
    <div class="drawer-header">
        <h3>PK戦 記録</h3>
        <button type="button" class="drawer-close-btn" onclick="closePKDrawer()">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
    <div class="drawer-body">
        <!-- 先攻・後攻チーム選択 -->
        <div class="pkTeamSelectArea">
            <div class="pkTeamRow">
                <label>先攻:</label>
                <select id="pkFirstTeamSelect" class="dialogInput"></select>
            </div>
            <div class="pkTeamRow">
                <label>後攻:</label>
                <select id="pkSecondTeamSelect" class="dialogInput"></select>
            </div>
        </div>

        <!-- 現在の入力ターン表示 -->
        <div id="pkCurrentTurn" class="pkCurrentTurn">
            入力待ち: 先攻 1本目
        </div>

        <!-- 結果入力ボタン（○ / ✖） -->
        <div class="pkInputButtons">
            <button id="pkSuccessBtn" class="pkResultBtn success">○ (成功)</button>
            <button id="pkFailBtn" class="pkResultBtn fail">✖ (失敗)</button>
        </div>
        
        <!-- グリッド表示エリア -->
        <div class="pkTableWrapper">
            <table class="pkGridTable">
                <thead>
                    <tr id="pkHeaderRow">
                        <th class="pkStickyLeft">チーム</th>
                        <th class="pkStickyRight">合計</th>
                    </tr>
                </thead>
                <tbody>
                    <tr id="pkFirstRow">
                        <td class="pkStickyLeft">
                            <span id="pkFirstTeamName" class="pkTeamName">先攻</span>
                        </td>
                        <td class="pkStickyRight">
                            <span id="pkFirstTotal" class="pkTeamTotal">0</span>
                        </td>
                    </tr>
                    <tr id="pkSecondRow">
                        <td class="pkStickyLeft">
                            <span id="pkSecondTeamName" class="pkTeamName">後攻</span>
                        </td>
                        <td class="pkStickyRight">
                            <span id="pkSecondTotal" class="pkTeamTotal">0</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- アクションボタン（1つ戻す） -->
        <div id="pkDialogButtons" style="margin-top: 15px;">
            <button id="pkUndoBtn" class="subButton" style="background:#757575; width: 100%;">1つ戻す</button>
        </div>
    </div>
</div>


<!-- ===================================== -->
<!-- 共通ダイアログ（構造修正版） -->
<!-- ===================================== -->
<div id="commonDialog" class="dialog">
    <div class="dialogCard">
        <h3 id="dialogTitle"></h3>
        <div id="dialogContent"></div>
        <div id="dialogButtons"></div>
    </div>
</div>




<!-- ===================================== -->
<!-- 試合履歴 -->
<!-- ===================================== -->

<section id="historyPage" class="page">
    <main>
        <div id="historyList">
            試合データはありません
        </div>
    </main>
</section>


</div>

<!-- アプリ -->
<script type="module" src="script.js"></script>

</body>

</html>
